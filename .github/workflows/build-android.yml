name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Accept Android Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "src/android/gradlew" ]; then chmod +x src/android/gradlew; fi
        if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi

    - name: Build with Gradle
      run: |
        if [ -d "src/android" ]; then
          cd src/android
        elif [ -d "android" ]; then
          cd android
        else
          echo "Pasta do projeto Android não encontrada!" && exit 1
        fi
        ./gradlew assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: otclient-mehah-fullscreen-apk
        path: |
          **/build/outputs/apk/release/*.apk
          **/build/outputs/apk/debug/*.apk
